user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstreams use host-exposed ports so the gateway can run with network_mode: host
    upstream action_logger    { server 127.0.0.1:3003; }
    upstream gym_logger       { server 127.0.0.1:3001; }
    upstream mobility_logger  { server 127.0.0.1:3002; }
    upstream nodered          { server 127.0.0.1:1880; }
    upstream appdaemon        { server 127.0.0.1:5050; }
    upstream zigbee2mqtt      { server 127.0.0.1:8080; }
    upstream portainer        { server 127.0.0.1:9000; }
    upstream grafana          { server 127.0.0.1:3000; }
    upstream walkingpad       { server 127.0.0.1:8050; }
    # Adjust to your wger backend (e.g., 8000 if you drop the wger nginx proxy)
    upstream wger             { server 127.0.0.1:8081; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 25m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # App UIs
        location = /action-logger { return 301 /action-logger/; }
        location /action-logger/  {
            proxy_set_header X-Forwarded-Prefix /action-logger;
            proxy_set_header X-Script-Name /action-logger;
            proxy_pass http://action_logger/;
        }

        location = /gym-logger { return 301 /gym-logger/; }
        location /gym-logger/  {
            proxy_set_header X-Forwarded-Prefix /gym-logger;
            proxy_set_header X-Script-Name /gym-logger;
            proxy_pass http://gym_logger/;
        }

        location = /mobility-logger { return 301 /mobility-logger/; }
        location /mobility-logger/  {
            proxy_set_header X-Forwarded-Prefix /mobility-logger;
            proxy_set_header X-Script-Name /mobility-logger;
            proxy_pass http://mobility_logger/;
        }

        location = /nodered { return 301 /nodered/; }
        location /nodered/  {
            proxy_set_header X-Forwarded-Prefix /nodered;
            proxy_set_header X-Script-Name /nodered;
            proxy_pass http://nodered/;
        }

        location = /appdaemon { return 301 /appdaemon/; }
        location /appdaemon/  {
            proxy_set_header X-Forwarded-Prefix /appdaemon;
            proxy_set_header X-Script-Name /appdaemon;
            proxy_pass http://appdaemon/;
        }

        location = /zigbee2mqtt { return 301 /zigbee2mqtt/; }
        location /zigbee2mqtt/  {
            proxy_set_header X-Forwarded-Prefix /zigbee2mqtt;
            proxy_set_header X-Script-Name /zigbee2mqtt;
            proxy_pass http://zigbee2mqtt/;
        }

        location = /portainer { return 301 /portainer/; }
        location /portainer/  {
            proxy_set_header X-Forwarded-Prefix /portainer;
            proxy_set_header X-Script-Name /portainer;
            proxy_pass http://portainer/;
        }

        location = /grafana { return 301 /grafana/; }
        location /grafana/  {
            proxy_set_header X-Forwarded-Prefix /grafana;
            proxy_set_header X-Script-Name /grafana;
            proxy_pass http://grafana/;
        }

        location = /walkingpad { return 301 /walkingpad/; }
        location /walkingpad/  {
            proxy_set_header X-Forwarded-Prefix /walkingpad;
            proxy_set_header X-Script-Name /walkingpad;
            proxy_pass http://walkingpad/;
        }

        location = /wger { return 301 /wger/; }
        location /wger/  {
            proxy_set_header X-Forwarded-Prefix /wger;
            proxy_set_header X-Script-Name /wger;
            proxy_pass http://wger/;
        }
    }
}
